openapi: 3.0.3
info:
  title: FORT (Fast Short) URL Shortener API
  description: REST API for managing short links, analytics, workspaces, and more.
  version: 1.0.0
  contact:
    name: FORT Support
    url: https://fort.example.com
    email: support@fort.example.com

servers:
  - url: "{protocol}://{host}/api/v1"
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
      host:
        default: localhost:8080
        description: API host

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key generated from the dashboard

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Validation failed
        message:
          type: string
          example: The slug field is required.

    Meta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        last_page:
          type: integer
          example: 8

    Link:
      type: object
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        user_id:
          type: integer
        original_url:
          type: string
          format: uri
        slug:
          type: string
        short_url:
          type: string
          format: uri
        password_hash:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        click_limit:
          type: integer
          nullable: true
        click_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LinkCreate:
      type: object
      required:
        - original_url
      properties:
        original_url:
          type: string
          format: uri
          description: The destination URL
        slug:
          type: string
          description: Custom alias (auto-generated if omitted)
          maxLength: 64
          pattern: "^[a-zA-Z0-9_-]+$"
        password:
          type: string
          description: Optional password to protect the link
        expires_at:
          type: string
          format: date-time
          description: Expiration date/time (ISO 8601)
        click_limit:
          type: integer
          description: Max clicks before link deactivates
        is_active:
          type: boolean
          default: true
        domain_id:
          type: integer
          description: Custom domain ID (optional)

    LinkUpdate:
      type: object
      properties:
        original_url:
          type: string
          format: uri
        slug:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
        password:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        click_limit:
          type: integer
          nullable: true
        is_active:
          type: boolean

    LinkBulkCreate:
      type: object
      required:
        - links
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/LinkCreate"

    Analytics:
      type: object
      properties:
        total_clicks:
          type: integer
        unique_clicks:
          type: integer
        time_series:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              clicks:
                type: integer
        breakdown:
          type: object
          properties:
            countries:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  value:
                    type: integer
            devices:
              type: object
              additionalProperties:
                type: integer
            browsers:
              type: object
              additionalProperties:
                type: integer
            os:
              type: object
              additionalProperties:
                type: integer

    Workspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        owner_id:
          type: integer
        plan:
          type: string
          enum:
            - free
            - pro
            - business
            - enterprise
        created_at:
          type: string
          format: date-time

    WorkspaceMember:
      type: object
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        user_id:
          type: integer
        role:
          type: string
          enum:
            - owner
            - admin
            - editor
            - viewer
        invited_at:
          type: string
          format: date-time
        joined_at:
          type: string
          format: date-time
          nullable: true
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string

    QRCode:
      type: object
      properties:
        id:
          type: integer
        link_id:
          type: integer
        format:
          type: string
          enum:
            - png
            - svg
        url:
          type: string
          format: uri

  responses:
    SuccessResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data: {}

    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string

paths:
  /links:
    get:
      summary: List all links
      description: Retrieve paginated list of links with optional filters.
      tags:
        - Links
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
              - expired
        - name: workspace_id
          in: query
          schema:
            type: integer
        - name: sort_by
          in: query
          schema:
            type: string
            default: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Paginated list of links
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Link"
                  meta:
                    $ref: "#/components/schemas/Meta"

    post:
      summary: Create a short link
      description: Create a new short URL. Slug is auto-generated if not provided.
      tags:
        - Links
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCreate"
      responses:
        "201":
          $ref: "#/components/responses/SuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /links/bulk:
    post:
      summary: Bulk create links
      description: Create multiple links in a single request.
      tags:
        - Links
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBulkCreate"
      responses:
        "201":
          $ref: "#/components/responses/SuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /links/{id}:
    get:
      summary: Get link details
      description: Retrieve a single link by ID including stats.
      tags:
        - Links
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/SuccessResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

    put:
      summary: Update a link
      description: Update the properties of an existing link.
      tags:
        - Links
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkUpdate"
      responses:
        "200":
          $ref: "#/components/responses/SuccessResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

    delete:
      summary: Delete a link
      description: Soft delete a link. Use hard=true for permanent deletion.
      tags:
        - Links
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hard
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/SuccessResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /links/{id}/analytics:
    get:
      summary: Get link analytics
      description: Retrieve detailed analytics for a specific link.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          schema:
            type: string
            enum:
              - hour
              - day
              - month
            default: day
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Analytics"

  /qrcode/{id}:
    get:
      summary: Generate QR code
      description: Generate a QR code image for a short link.
      tags:
        - QR Code
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
            enum:
              - png
              - svg
            default: png
        - name: size
          in: query
          schema:
            type: integer
            default: 300
            maximum: 1000
      responses:
        "200":
          description: QR code image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string

  /workspaces:
    get:
      summary: List workspaces
      description: Get all workspaces for the authenticated user.
      tags:
        - Workspaces
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SuccessResponse"

    post:
      summary: Create workspace
      description: Create a new workspace.
      tags:
        - Workspaces
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "201":
          $ref: "#/components/responses/SuccessResponse"

  /workspaces/{id}:
    get:
      summary: Get workspace details
      tags:
        - Workspaces
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/SuccessResponse"

  /workspaces/{id}/members:
    get:
      summary: List workspace members
      tags:
        - Workspaces
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/SuccessResponse"

    post:
      summary: Invite member to workspace
      tags:
        - Workspaces
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum:
                    - admin
                    - editor
                    - viewer
      responses:
        "201":
          $ref: "#/components/responses/SuccessResponse"

  /slug/check:
    get:
      summary: Check slug availability
      description: Check if a slug/alias is available for use.
      tags:
        - Links
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                        example: true

  /health:
    get:
      summary: Health check
      description: Check API health status.
      tags:
        - System
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        format: date-time
