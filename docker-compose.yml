version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/fort.ini
    environment:
      - DB_DRIVER=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=fort
      - DB_USER=fort
      - DB_PASSWORD=secret
      - APP_URL=http://localhost:8080
    networks:
      - fort-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=fort
      - POSTGRES_USER=fort
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fort"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fort-network
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fort-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fort-network:
    driver: bridge
